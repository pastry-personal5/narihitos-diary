# Copy this file to config/global_config.yaml, replace every placeholder, and
# restrict the real file to its owner with: chmod 600 config/global_config.yaml

sources:
  ayumi_directory_name: "REPLACE_WITH_ICLOUD_DIRECTORY_NAME"

paths:
  entries_root: "~/Documents/narihitos-diary/entries"

notion:
  token: "REPLACE_WITH_NOTION_TOKEN"
  root_page_id: "REPLACE_WITH_NOTION_ROOT_PAGE_ID"

server:
  # After 8771 and 8772, try this many additional consecutive loopback ports.
  port_fallback_count: 8

assistants:
  # Zero or more profiles are allowed. Each alias becomes backend `codex.<alias>`.
  codex_profiles:
    - alias: "example"
      codex_home: "/ABSOLUTE/PATH/TO/CODEX_HOME"
      # Optional; when omitted, `codex` is resolved from PATH at startup.
      codex_executable: "/ABSOLUTE/PATH/TO/codex"
