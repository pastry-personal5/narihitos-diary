[workspace]
members = [
    "apps/nd",
    "crates/diary-connectors",
    "crates/diary-control",
    "crates/diary-control-contract",
    "crates/diary-core",
    "crates/diary-tui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
diary-connectors = { version = "0.1.0", path = "crates/diary-connectors", default-features = false }
diary-control = { version = "0.1.0", path = "crates/diary-control", default-features = false }
diary-control-contract = { version = "0.1.0", path = "crates/diary-control-contract", default-features = false }
diary-core = { version = "0.1.0", path = "crates/diary-core", default-features = false }
diary-tui = { version = "0.1.0", path = "crates/diary-tui", default-features = false }
